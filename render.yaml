# Low-traffic public Demo settings; review docs/RENDER.md before creating a service.
# Applying a Blueprint starts a public service even when auto-deploys are off.
services:
  - type: web
    name: csv-validator
    runtime: python
    plan: free
    branch: main
    numInstances: 1
    autoDeployTrigger: "off"
    buildCommand: bash scripts/render-build.sh
    startCommand: python scripts/start_render.py
    healthCheckPath: /health
    envVars:
      - key: CSV_VALIDATOR_MAX_ACTIVE_REQUESTS
        value: "2"
      - key: CSV_VALIDATOR_UPLOAD_TIMEOUT_SECONDS
        value: "15"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
# RENDER_EXTERNAL_HOSTNAME and PORT are supplied by Render.
# Custom domains: set CSV_VALIDATOR_ALLOWED_HOSTS to every exact active hostname.
# No trusted proxy setting is required: forwarded headers are ignored by default.
# Render mode derives canonical public HTTPS from RENDER=true, never request headers.
