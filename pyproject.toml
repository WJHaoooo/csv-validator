[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "configurable-csv-validator"
version = "0.1.0"
description = "Schema-driven CSV validation and JSON conversion tool built with Python."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "httpx2>=2,<3"]
web = [
    "fastapi>=0.162.2,<1",
    "starlette>=1.10,<2",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.30,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
