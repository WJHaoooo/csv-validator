[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "configurable-csv-validator"
version = "0.1.0"
description = "Schema-driven CSV validation and JSON conversion tool built with Python."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=9.2", "httpx2>=2.16,<3"]
web = [
    "fastapi>=0.162.2,<1",
    "starlette>=1.10,<2",
    "anyio>=4.16,<5",
    "python-multipart>=0.0.33,<1",
    "uvicorn>=0.54,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.setuptools.package-data]
csv_validator = ["static/*.html", "static/*.css", "static/*.js"]
